<!DOCTYPE HTML>
<html lang="tr">
<head>
<meta charset="UTF-8">
<!-- Mobil cihazlarda düzgün görünmesi için eklendi -->
<meta name="viewport" content="width=device-width, initial-scale=1.0"> 
<title>Ehliyet Sınav Soruları Uygulaması</title>

<!-- Open Graph Meta Etiketleri -->
<meta property="og:title" content="Ehliyet Sınav Soruları Uygulaması">
<meta property="og:description" content="Ehliyet sınavına hazırlananlar için en iyi uygulama. Hemen indir ve sınavda başarılı ol!">
<meta property="og:image" content="https://puanver.ehliyet.io/puan1.png">
<meta property="og:url" content="https://puanver.ehliyet.io">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Ehliyet Sınav Soruları Uygulaması">
<meta name="twitter:description" content="Ehliyet sınavına hazırlananlar için en iyi uygulama. Hemen indir ve sınavda başarılı ol!">
<meta name="twitter:image" content="https://puanver.ehliyet.io/puan1.png">

<style>
    /* Yönlendirme başarısız olursa görünecek ekranın tasarımı */
    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
        margin: 0;
        background-color: #f8f9fa;
        text-align: center;
        padding: 20px;
    }
    .container {
        max-width: 400px;
        width: 100%;
    }
    .profile-img {
        width: 120px;
        height: 120px;
        border-radius: 20px;
        margin-bottom: 20px;
        object-fit: cover;
    }
    h1 {
        font-size: 18px;
        color: #333;
        margin-bottom: 25px;
        line-height: 1.4;
    }
    .btn {
        display: block;
        width: 100%;
        padding: 16px;
        margin-bottom: 15px;
        border-radius: 12px;
        text-decoration: none;
        color: white;
        font-size: 16px;
        font-weight: 600;
        box-sizing: border-box;
        transition: opacity 0.2s;
    }
    .btn:active {
        opacity: 0.8;
    }
    .btn-ios {
        background-color: #000000;
    }
    .btn-android {
        background-color: #3DDC84;
        color: #000000;
    }
</style>

<script type="text/javascript">
// Orijinal yönlendirme kodun (Hiçbir şey değiştirilmedi)
if((navigator.userAgent.match(/iPhone/i)) || (navigator.userAgent.match(/iPod/i))) {
    window.location = "https://apps.apple.com/us/app/id6744372996";
} else if(navigator.userAgent.match(/android/i)) {
    window.location = "https://play.google.com/store/apps/details?id=com.ehliyetsorulari.cenkhoca";
} else {
	window.location = "https://apps.apple.com/us/app/id6744372996";
}
</script>

</head>
<body>
    <div class="container">
        <!-- Sabit Cenk Hoca resmini buraya çekebilirsin. Şimdilik og:image linkini koydum. -->
        <img src="https://puanver.ehliyet.io/puan1.png" alt="Ehliyet Cenk Hoca" class="profile-img">
        
        <h1>Otomatik yönlendirme gerçekleşmediyse, lütfen cihazınıza uygun mağazayı seçin:</h1>
        
        <a href="https://apps.apple.com/us/app/id6744372996" class="btn btn-ios">App Store'dan İndir</a>
        <a href="https://play.google.com/store/apps/details?id=com.ehliyetsorulari.cenkhoca" class="btn btn-android">Google Play'den İndir</a>
    </div>
</body>
</html>
